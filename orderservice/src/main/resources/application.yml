# Bu dosya, userservice'in tüm temel yapılandırmalarını içerir.

spring:
  # Uygulama adı
  application:
    name: order-service

  # Spring Cloud Config Server'a bağlanma ayarları
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: http://configserver:8888

  # Database bağlantı ayarları
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: ubuntu123puro
    driver-class-name: org.postgresql.Driver

  # JPA (Hibernate) ayarları
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Eureka Client ayarları
eureka:
  client:
    service-url:
      defaultZone: http://discoveryservice:8761/eureka/
