# Bu dosya, restaurantservice'in temel yapılandırmalarını içerir.

spring:
  # Uygulama adı
  application:
    name: restaurant-service

  # Spring Cloud Config Server'a bağlanma ayarları
  config:
    import: "optional:configserver:"
  cloud:
    config:
      # localhost yerine, docker-compose.yml dosyasındaki servis adını kullanıyoruz.
      uri: http://configserver:8888

  # Database bağlantı ayarları
  datasource:
    # Veritabanı adını docker-compose.yml ile eşleştiriyoruz.
    url: jdbc:postgresql://postgresdb:5432/restaurant_db
    username: postgres
    password: ubuntu123puro
    driver-class-name: org.postgresql.Driver

  # JPA (Hibernate) ayarları
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Eureka Client ayarları
eureka:
  client:
    service-url:
      # localhost yerine, docker-compose.yml dosyasındaki servis adını kullanıyoruz.
      defaultZone: http://discoveryservice:8761/eureka/

server:
  port: 8082
