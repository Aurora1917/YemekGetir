# Bu dosya, userservice'in tüm temel yapılandırmalarını içerir.

spring:
  # Uygulama adı
  application:
    name: user-service

  # Spring Cloud Config Server'a bağlanma ayarları
  config:
    import: "optional:configserver:"
  cloud:
    config:
      # docker-compose.yml'deki servis adını kullanıyoruz
      uri: http://configserver:8888

  # Database bağlantı ayarları - docker-compose.yml ile uyumlu hale getirildi
  datasource:
    # Docker-compose'daki doğru veritabanı servisi ve veritabanı adı
    url: jdbc:postgresql://postgres_user_db:5432/user_db
    username: postgres
    password: ubuntu123puro
    driver-class-name: org.postgresql.Driver

  # JPA (Hibernate) ayarları
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Server port
server:
  port: 8081

# Eureka Client ayarları
eureka:
  client:
    service-url:
      # docker-compose.yml'deki discovery servis adı
      defaultZone: http://discoveryservice:8761/eureka/
